baseurl: https://langest.amenabar.de/
theme: hugo-theme-stack

taxonomies:
  category: categories
  tag: tags
  location: locations
  faction: factions
  adventure: adventures
  campaign: campaigns
title: Langest Universe
copyright: B. Agustín Amenabar L.

DefaultContentLanguage: es
hasCJKLanguage: false

# Menú principal por idioma (fuente única de verdad).
# Los bloques `menu:` incrustados en los _index.md se retiraron para evitar
# definiciones duplicadas; el bloque `languageMenus:` de la config anterior
# NO era una clave de Hugo (se ignoraba) y se elimina.
languages:
    es:
        languageName: Español
        languageCode: es-ES
        title: Universo de Langest
        weight: 1
        params:
            sidebar:
                subtitle: En hielo serán forjados los héroes
        menu:
            main:
                - identifier: home
                  name: Inicio
                  url: /
                  weight: -100
                  params:
                      icon: home
                - identifier: intro
                  name: Intro
                  url: /intro/
                  weight: 1
                - identifier: world
                  name: Mundo
                  url: /world/
                  weight: 10
                - identifier: adventures
                  name: Aventuras
                  url: /adventures/
                  weight: 20
                - identifier: campaigns
                  name: Campañas
                  url: /campaigns/
                  weight: 25
                - identifier: mechanics
                  name: Mecánicas
                  url: /mechanics/
                  weight: 30
    en:
        languageName: English
        languageCode: en-US
        title: Langest Campaign Setting
        weight: 2
        params:
            sidebar:
                subtitle: Heroes shall be forged by ice
        menu:
            main:
                - identifier: home
                  name: Home
                  url: /
                  weight: -100
                  params:
                      icon: home
                - identifier: intro
                  name: Intro
                  url: /intro/
                  weight: 1
                - identifier: world
                  name: World
                  url: /world/
                  weight: 10
                - identifier: adventures
                  name: Adventures
                  url: /adventures/
                  weight: 20
                - identifier: campaigns
                  name: Campaigns
                  url: /campaigns/
                  weight: 25
                - identifier: mechanics
                  name: Mechanics
                  url: /mechanics/
                  weight: 30

pagination:
    pagerSize: 12

permalinks:
    page: /:slug/
    # `world` y `adventures` SIN permalink: el árbol de directorios ya produce
    # las URLs correctas (/world/factions/x/, /adventures/<modulo>/x/). Los
    # patrones anteriores duplicaban el segmento o aplanaban los módulos
    # (/world/world/<slug-de-titulo>/, /adventures/background-the-medusa-threat/).
    # NOTA: `campaigns` NO necesita permalink — las URLs del árbol de
    # directorios (/campaigns/<campaña>/sessions/<slug>/) son exactamente las
    # deseadas. Un permalink `campaigns: /campaigns/:sections/:slug/` DUPLICA
    # el segmento (:sections ya incluye 'campaigns').
    # `post: /p/:slug/` se elimina junto con content/post/ (PR 5);
    # cada página migrada lleva aliases de su URL anterior.

params:
    mainSections:
        - campaigns
    # Portada y widgets muestran la bitácora de campañas (decisión del dueño).
    featuredImageField: image
    rssFullContent: true
    favicon: /favicon.png

    footer:
        since: 2009
        customText:

    dateFormat:
        published: 02-01-2006
        lastUpdated: 02-01-2006 15:04

    sidebar:
        emoji: ❄️
        subtitle: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        avatar:
            enabled: true
            local: true
            src: img/winter-tree.jpg

    article:
        math: false
        toc: true
        readingTime: true
        # license:
        #     enabled: true
        #     default: Licensed under CC BY-NC-SA 4.0

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

social:
    - identifier: github
      name: GitHub
      url: https://github.com/baamenabar/
      params:
          icon: brand-github

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

        - name: locations
          weight: 80

        - name: factions
          weight: 80

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4